services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chefvision
      POSTGRES_USER: chefvision
      POSTGRES_PASSWORD: chefvision
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chefvision -d chefvision"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrate:
    image: pgvector/pgvector:pg16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://chefvision:chefvision@db:5432/chefvision}
    volumes:
      - ../sql:/migrations:ro
      - ../scripts/migrate.sh:/scripts/migrate.sh:ro
    command: ["/bin/sh", "/scripts/migrate.sh"]

  normalizer:
    build:
      context: ..
      dockerfile: apps/normalizer/Dockerfile
    environment:
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL:-postgresql://chefvision:chefvision@db:5432/chefvision}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      HIGH_CONF_THRESHOLD: 0.88
      LOW_CONF_THRESHOLD: 0.55
      EMBEDDING_PROVIDER: minilm
      EMBEDDING_MODEL_ID: onnx-community/all-MiniLM-L6-v2-ONNX
      EMBEDDING_DTYPE: fp32
      EMBEDDING_DIMENSIONS: 384
      EMBEDDING_CACHE_DIR: /tmp/chefvision-model-cache
      EMBEDDING_ALLOW_REMOTE_MODELS: "true"
      AUTO_BACKFILL_EMBEDDINGS: "true"
      MODEL_VERSION: docker-normalizer-v2-minilm
    ports:
      - "4001:4001"
    volumes:
      - normalizer-model-cache:/tmp/chefvision-model-cache
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      redis:
        condition: service_started
      normalizer:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://chefvision:chefvision@db:5432/chefvision}
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in infra/.env}
      NORMALIZER_URL: http://normalizer:4001
      STORAGE_MODE: db
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    ports:
      - "4000:4000"

  ocr:
    build:
      context: ../../Ocr-Model-1
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
  normalizer-model-cache:
